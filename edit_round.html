<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Round</title>

  <style>
    :root {
      --aldi-blue: #00539f;
      --aldi-blue-deep: #003b73;
      --aldi-yellow: #ffcf00;
      --aldi-orange: #f58220;
      --bg: #f5f8fc;
      --bg-accent: #f7fbff;
      --text: #10213a;
      --muted: #5f6f85;
      --card: #ffffff;
      --border: #d8e3f0;
      --soft-surface: #f8fbff;
      --shadow: 0 10px 30px rgba(0, 49, 102, 0.08);
    }

    body.dark-mode {
      --bg: #0b1420;
      --bg-accent: #101c2b;
      --text: #edf4ff;
      --muted: #9fb2c9;
      --card: #132235;
      --border: #223853;
      --soft-surface: #17283d;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, var(--bg-accent), var(--bg));
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
      padding: 20px 16px 40px;
    }

    .card {
      background: var(--card);
      border-radius: 26px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 22px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      color: var(--aldi-blue-deep);
    }

    body.dark-mode h1 { color: #d9ebff; }

    p { color: var(--muted); margin: 0 0 18px; }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .match {
      background: linear-gradient(180deg, var(--card) 0%, var(--bg-accent) 100%);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 14px;
    }

    .team-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 14px;
      background: var(--soft-surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      margin-top: 10px;
    }

    .team-name { font-weight: 800; }

    .score-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .score-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(180deg, var(--card), var(--soft-surface));
      font-size: 22px;
      font-weight: 800;
      color: var(--aldi-blue-deep);
      cursor: pointer;
    }

    body.dark-mode .score-btn { color: #d9ebff; }

    .score-value {
      width: 50px;
      text-align: center;
      font-size: 24px;
      font-weight: 900;
      color: var(--aldi-blue-deep);
      border: none;
      background: transparent;
    }

    body.dark-mode .score-value { color: #d9ebff; }

    .action-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .btn, .btn-link {
      border: none;
      padding: 13px 16px;
      border-radius: 16px;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--aldi-blue), var(--aldi-blue-deep));
      color: white;
    }

    .btn-soft {
      background: linear-gradient(135deg, var(--aldi-yellow), var(--aldi-orange));
      color: #10213a;
    }

    @media (max-width: 720px) {
      .team-row { grid-template-columns: 1fr; }
      .score-controls { justify-content: space-between; }
    }
  </style>

  <script>
    function changeScore(inputId, delta) {
      const input = document.getElementById(inputId);
      let value = parseInt(input.value || "0", 10);
      value = Math.max(0, value + delta);
      input.value = value;
    }

    function toggleDarkMode() {
      document.body.classList.toggle("dark-mode");
      localStorage.setItem("aldiDarkMode", document.body.classList.contains("dark-mode") ? "on" : "off");
    }

    window.addEventListener("DOMContentLoaded", () => {
      if (localStorage.getItem("aldiDarkMode") === "on") {
        document.body.classList.add("dark-mode");
      }
    });
  </script>
</head>

<body>
  <div class="container">
    <section class="card">
      <div class="top-row">
        <div>
          <h1>Edit Round {{ round_number }}</h1>
          <p>Adjust any saved score below. Standings and results update automatically.</p>
        </div>
        <button class="btn btn-soft" type="button" onclick="toggleDarkMode()">Dark mode</button>
      </div>

      <form method="post" action="/update-round/{{ round_number }}">
        {% for match in matches %}
          <div class="match">
            <div style="font-weight: 800; color: var(--aldi-blue-deep);">Court {{ loop.index }}</div>

            <div class="team-row">
              <div class="team-name">{{ match.teamA[0] }} / {{ match.teamA[1] }}</div>
              <div class="score-controls">
                <button class="score-btn" type="button" onclick="changeScore('scoreA_{{ loop.index0 }}', -1)">−</button>
                <input class="score-value" id="scoreA_{{ loop.index0 }}" name="scoreA_{{ loop.index0 }}" value="{{ match.scoreA if match.scoreA != '' else 0 }}" readonly>
                <button class="score-btn" type="button" onclick="changeScore('scoreA_{{ loop.index0 }}', 1)">+</button>
              </div>
            </div>

            <div class="team-row">
              <div class="team-name">{{ match.teamB[0] }} / {{ match.teamB[1] }}</div>
              <div class="score-controls">
                <button class="score-btn" type="button" onclick="changeScore('scoreB_{{ loop.index0 }}', -1)">−</button>
                <input class="score-value" id="scoreB_{{ loop.index0 }}" name="scoreB_{{ loop.index0 }}" value="{{ match.scoreB if match.scoreB != '' else 0 }}" readonly>
                <button class="score-btn" type="button" onclick="changeScore('scoreB_{{ loop.index0 }}', 1)">+</button>
              </div>
            </div>
          </div>
        {% endfor %}

        <div class="action-row">
          <button class="btn btn-primary" type="submit">Save changes</button>
          <a class="btn-link btn-soft" href="/">Back to home</a>
        </div>
      </form>
    </section>
  </div>
</body>
</html>
